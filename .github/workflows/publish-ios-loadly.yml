name: iOS Ad Hoc to Loadly

# Manual and tag-triggered only, unlike the Android pipeline which also checks
# every push to main. An iOS build needs a macOS runner and takes far longer,
# and analyze/test are platform-independent so the Android job already covers
# them on every push. Add `push: branches: [main]` here if you want iOS-specific
# compile breaks caught earlier — `flutter build ios --no-codesign` does that
# without any secrets.
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Build config (staging currently hits the same API as prod)
        type: choice
        default: prod
        options: [prod, staging]
      notes:
        description: What testers should look at in this build
        type: string
        default: ''
  push:
    tags: ['v*']

concurrency:
  group: loadly-ios-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.4
  BUNDLE_ID: click.magento2.clickalize
  VERSION_CODE_OFFSET: 1000

jobs:
  build:
    # macOS 26 / arm64, Xcode 26.4.1 by default. Free minutes because this repo
    # is public; a private repo bills macOS at 10x.
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Report the toolchain
        run: |
          set -euo pipefail
          echo "Xcode: $(xcodebuild -version | head -1)"
          echo "macOS: $(sw_vers -productVersion)  arch: $(uname -m)"

      - name: Resolve the flavor
        id: cfg
        env:
          FLAVOR: ${{ github.event_name == 'push' && 'prod' || inputs.flavor }}
        run: |
          set -euo pipefail
          test -f "config/${FLAVOR}.json" || { echo "::error::config/${FLAVOR}.json missing"; exit 1; }
          echo "flavor=${FLAVOR}" >> "$GITHUB_OUTPUT"
          echo "entrypoint=lib/main_${FLAVOR}.dart" >> "$GITHUB_OUTPUT"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Certificate and profile both land in RUNNER_TEMP, never the workspace.
      - name: Import the signing certificate and profile
        id: signing
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          LOADLY_API_KEY: ${{ secrets.LOADLY_API_KEY }}
        run: |
          set -euo pipefail

          # Named individually so a missing one says which, rather than failing
          # twenty minutes later inside xcodebuild.
          for v in CERT_B64 CERT_PASSWORD PROFILE_B64 TEAM_ID LOADLY_API_KEY; do
            eval "val=\${$v:-}"
            [ -n "$val" ] || { echo "::error::secret for $v is not set — see docs/ci-loadly-ios.md"; exit 1; }
          done

          CERT="$RUNNER_TEMP/cert.p12"
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          # tr -d '\r' guards a secret pasted from Windows; base64 -D is the
          # macOS spelling (BSD), not GNU's -d.
          printf '%s' "$CERT_B64"    | tr -d '\r' | base64 -D > "$CERT"
          printf '%s' "$PROFILE_B64" | tr -d '\r' | base64 -D > "$PROFILE"
          test -s "$CERT"    || { echo "::error::decoded certificate is empty — check IOS_CERTIFICATE_P12_BASE64"; exit 1; }
          test -s "$PROFILE" || { echo "::error::decoded profile is empty — check IOS_PROVISIONING_PROFILE_BASE64"; exit 1; }

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW=$(uuidgen)
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          # Without a timeout the keychain can relock mid-build and codesign
          # starts failing halfway through.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -A -t cert -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security \
            || { echo "::error::could not import the .p12 — wrong IOS_CERTIFICATE_PASSWORD, or the export has no private key"; exit 1; }
          # Mandatory on modern macOS. Without it codesign blocks on a GUI
          # keychain-access prompt that no one can answer, and the job hangs
          # until it times out rather than failing.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          # Put it in the search list, keeping the login keychain present.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          echo "--- codesigning identities ---"
          security find-identity -v -p codesigning "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution"; then
            echo "::error::no 'Apple Distribution' identity in the keychain. An Ad Hoc build"
            echo "::error::cannot be signed with a development certificate — re-export the"
            echo "::error::DISTRIBUTION certificate as .p12, with its private key."
            exit 1
          fi

          # Read the profile rather than asking for its name as a fifth secret:
          # a secret can disagree with the file, the file cannot disagree with
          # itself.
          PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$PROFILE" > "$PLIST"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PLIST")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PLIST")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$PLIST")
          PROFILE_APPID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PLIST")
          PROFILE_EXPIRY=$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' "$PLIST")
          DEVICES=$(/usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$PLIST" 2>/dev/null | grep -c '^ ' || true)
          GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$PLIST" 2>/dev/null || echo unknown)

          echo "profile:  $PROFILE_NAME"
          echo "uuid:     $PROFILE_UUID"
          echo "team:     $PROFILE_TEAM"
          echo "app id:   $PROFILE_APPID"
          echo "expires:  $PROFILE_EXPIRY"
          echo "devices:  $DEVICES"

          # Each of these is a real failure mode with an unhelpful native error.
          if [ "$PROFILE_TEAM" != "$TEAM_ID" ]; then
            echo "::error::profile team '$PROFILE_TEAM' != IOS_TEAM_ID '$TEAM_ID'"
            exit 1
          fi
          case "$PROFILE_APPID" in
            *".${BUNDLE_ID}"|*".*") ;;
            *) echo "::error::profile is for '$PROFILE_APPID', which does not cover ${BUNDLE_ID}"; exit 1;;
          esac
          if [ "$GET_TASK_ALLOW" = "true" ]; then
            echo "::error::this is a DEVELOPMENT profile (get-task-allow=true), not Ad Hoc."
            echo "::error::Create a Distribution -> Ad Hoc profile in the Apple portal."
            exit 1
          fi
          # Not "you forgot to tick devices". Apple will not issue an Ad Hoc
          # profile with none, so an empty ProvisionedDevices means this is an
          # App Store or Enterprise profile — which passes every check above
          # (right team, right App ID, get-task-allow false) and then fails
          # 20 minutes later inside exportArchive with "doesn't support the
          # ad-hoc distribution method".
          if [ "$DEVICES" -eq 0 ]; then
            echo "::error::the profile registers no devices, so it is not an Ad Hoc profile —"
            echo "::error::an App Store or Enterprise one looks identical to every check above."
            echo "::error::Create it under Profiles -> Distribution -> Ad Hoc, ticking each device."
            exit 1
          fi

          # Flutter 3.44 looks for profiles ONLY in the Xcode 16+ location, but
          # some xcodebuild paths still read the legacy one. Installing to both
          # costs nothing and removes a whole class of "requires a provisioning
          # profile" failures.
          NEW_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          OLD_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$NEW_DIR" "$OLD_DIR"
          cp "$PROFILE" "$NEW_DIR/$PROFILE_UUID.mobileprovision"
          cp "$PROFILE" "$OLD_DIR/$PROFILE_UUID.mobileprovision"

          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"
          echo "devices=$DEVICES" >> "$GITHUB_OUTPUT"

      - name: Compute the version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          CODE=$(( ${{ github.run_number }} + ${{ env.VERSION_CODE_OFFSET }} ))
          case "$CODE" in ''|*[!0-9]*) echo "::error::bad build number '$CODE'"; exit 1;; esac
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

          # iOS is stricter than Android about the version STRING, and silently
          # so: it strips everything but digits and dots, then pads to three
          # segments, reporting the change only at trace verbosity. Android
          # passes the same string through untouched. So the two platforms would
          # disagree about what "v1.2.0-rc1" means. Normalise here, out loud.
          NAME=""
          if [ "$REF_TYPE" = "tag" ]; then
            RAW="${REF_NAME#v}"
            # Rejected the same way the Android workflow rejects it, and for the
            # same reason. Without this, `vrc1` fails the Android job outright
            # while iOS quietly invents "1.0.0" and publishes it — one tag, two
            # platforms, two different stories.
            if ! printf '%s' "$RAW" | grep -qE '^[0-9]+(\.[0-9]+)*([-+][0-9A-Za-z.-]+)?$'; then
              echo "::error::tag '$REF_NAME' is not a version — expected v1.2.0 or v1.2.0-rc1"
              exit 1
            fi
            # Drop any prerelease/build suffix FIRST. Left to itself, iOS keeps
            # stray digits out of it — "1.2.0-rc1" becomes "1.2.01", a higher
            # version than the 1.2.0 that follows it. Cutting at the first - or +
            # yields the version the tag actually meant.
            NAME=$(printf '%s' "${RAW%%[-+]*}" | tr -cd '0-9.' | sed 's/\.\{2,\}/./g; s/^\.//; s/\.$//')
            [ -n "$NAME" ] || { echo "::error::tag '$REF_NAME' has no version in it"; exit 1; }
            while [ "$(printf '%s' "$NAME" | tr -cd '.' | wc -c | tr -d ' ')" -lt 2 ]; do
              NAME="${NAME}.0"
            done
            if [ "$NAME" != "$RAW" ]; then
              echo "::warning::CFBundleShortVersionString is '$NAME'; the tag said '$RAW'. iOS"
              echo "::warning::only accepts digits and dots, so Android will report '$RAW' for"
              echo "::warning::the same tag."
            fi
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "CFBundleShortVersionString: ${NAME:-<from pubspec>}  CFBundleVersion: $CODE"

      # Signing is driven entirely by FLUTTER_XCODE_* environment variables.
      # Flutter strips that prefix and passes the rest to xcodebuild as
      # command-line build settings, which are the highest-precedence layer —
      # above the project's own. So CI signs manually while the checked-in
      # project stays on automatic signing, and nothing in the repo changes.
      # That matters here: the only developer is on Windows and could not
      # repair a broken Xcode project.
      - name: Build the Ad Hoc IPA
        env:
          FLUTTER_XCODE_CODE_SIGN_STYLE: Manual
          FLUTTER_XCODE_DEVELOPMENT_TEAM: ${{ secrets.IOS_TEAM_ID }}
          FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER: ${{ steps.signing.outputs.profile_uuid }}
          # Overrides the project's three hardcoded
          # CODE_SIGN_IDENTITY[sdk=iphoneos*] = "iPhone Developer" entries, which
          # name a DEVELOPMENT identity and cannot sign an Ad Hoc distribution.
          FLUTTER_XCODE_CODE_SIGN_IDENTITY: Apple Distribution
          BUILD_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          ARGS=()
          [ -n "${BUILD_NAME:-}" ] && ARGS+=("--build-name=${BUILD_NAME}")

          # --export-method takes the LEGACY spelling: Flutter's own arg parser
          # only accepts ad-hoc/app-store/development/enterprise and translates
          # to Xcode 15.4+'s "release-testing" itself. Writing the modern name
          # here is rejected before xcodebuild ever runs. (A hand-written
          # ExportOptions.plist would need the opposite — the modern name — but
          # letting Flutter generate it keeps this version-adaptive.)
          #
          # -v so the profile-lookup traces are visible: without it, a failed
          # lookup silently degrades to a plist that cannot sign.
          flutter build ipa --release -v \
            -t "${{ steps.cfg.outputs.entrypoint }}" \
            --dart-define-from-file="config/${{ steps.cfg.outputs.flavor }}.json" \
            --build-number="${{ steps.version.outputs.code }}" \
            --export-method ad-hoc \
            ${ARGS[@]+"${ARGS[@]}"}

      - name: Locate and verify the IPA
        id: ipa
        run: |
          set -euo pipefail
          # `flutter build ipa` exits 0 even when the export fails — it counts a
          # successful .xcarchive as success and only prints the export error.
          # So the artifact, not the exit code, is the evidence.
          # `|| true` is load-bearing. xcodebuild creates build/ios/ipa, not
          # Flutter, so an export that dies during signing leaves it absent —
          # find then exits 1, pipefail propagates, and set -e would kill the
          # step at this assignment, before the message below ever prints. That
          # is precisely the failure this step exists to explain.
          IPA=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' 2>/dev/null | head -n1 || true)
          if [ -z "$IPA" ]; then
            echo "::error::no .ipa was produced. The archive may have succeeded while the"
            echo "::error::export failed — search the log above for 'error:' and for"
            echo "::error::'Encountered error while creating the IPA'."
            exit 1
          fi
          # Filename comes from xcodebuild, not Flutter, so it is never assumed.
          echo "path=$IPA" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$IPA")" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$IPA" | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "Built $(basename "$IPA") ($(du -h "$IPA" | cut -f1))"

      - name: Upload to Loadly
        id: loadly
        env:
          LOADLY_API_KEY: ${{ secrets.LOADLY_API_KEY }}
          IPA: ${{ steps.ipa.outputs.path }}
          NOTES: ${{ inputs.notes || github.ref_name }}
          SHA: ${{ github.sha }}
          DEVICES: ${{ steps.signing.outputs.devices }}
        run: |
          set -euo pipefail
          DESC="${NOTES:-} (${SHA:0:7}, build ${{ steps.version.outputs.code }})"
          # Loadly shows this on the install page. Ad Hoc installs fail with an
          # unexplained "Unable to Install" on any device not in the profile, so
          # the constraint belongs where the tester will see it.
          DESC="$DESC — Ad Hoc: installable only on the ${DEVICES} device(s) registered in this build"

          RESP="$RUNNER_TEMP/loadly-response.json"

          # Same contract as the Android job: Loadly answers HTTP 200 even on
          # failure and reports the real outcome only in the body's `code`, so
          # no curl -f. No --retry either — this POST creates a resource, and a
          # 5xx arriving after the body was accepted would re-send the whole
          # file and leave duplicate builds.
          HTTP=$(curl -sS -o "$RESP" -w '%{http_code}' \
            --connect-timeout 30 --max-time 900 \
            https://api.loadly.io/apiv2/app/upload \
            --form-string "_api_key=${LOADLY_API_KEY}" \
            --form-string "buildUpdateDescription=${DESC}" \
            -F "file=@${IPA}")

          if [ "$HTTP" != "200" ]; then
            echo "::error::Loadly returned HTTP $HTTP"
            head -c 2000 "$RESP" || true
            exit 1
          fi
          if ! jq -e . "$RESP" > /dev/null 2>&1; then
            echo "::error::Loadly returned 200 with a non-JSON body:"
            head -c 2000 "$RESP"
            exit 1
          fi

          CODE=$(jq -r '.code // empty' "$RESP")
          if [ "$CODE" != "0" ]; then
            MSG=$(jq -r '.message // "no message"' "$RESP")
            echo "::error::Loadly upload failed — code ${CODE:-missing}: $MSG"
            case "$CODE" in
              1001|1002|1055) echo "::error::That is an API-key problem. Check the LOADLY_API_KEY secret.";;
              1022)           echo "::error::File too large for the account.";;
              1026)           echo "::error::Loadly rejected the file type — check the .ipa is intact.";;
              1028)           echo "::error::Bundle identifier could not be read from the IPA.";;
              1098)           echo "::error::Hourly API limit reached. Retry later.";;
            esac
            exit 1
          fi

          SLUG=$(jq -r '.data.buildShortcutUrl // empty' "$RESP")
          test -n "$SLUG" || { echo "::error::upload reported success but returned no shortcut"; exit 1; }
          echo "url=https://i.loadly.io/${SLUG}" >> "$GITHUB_OUTPUT"
          echo "qr=$(jq -r '.data.buildQRCodeURL // empty' "$RESP")" >> "$GITHUB_OUTPUT"
          echo "key=$(jq -r '.data.buildKey // empty' "$RESP")" >> "$GITHUB_OUTPUT"
          echo "Install: https://i.loadly.io/${SLUG}"
          echo "::notice title=iOS install link::https://i.loadly.io/${SLUG}"

      - name: Summarise
        if: success()
        env:
          URL: ${{ steps.loadly.outputs.url }}
          QR: ${{ steps.loadly.outputs.qr }}
          BUILD_KEY: ${{ steps.loadly.outputs.key }}
          FLAVOR: ${{ steps.cfg.outputs.flavor }}
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
          SIZE: ${{ steps.ipa.outputs.size }}
          PROFILE: ${{ steps.signing.outputs.profile_name }}
          DEVICES: ${{ steps.signing.outputs.devices }}
          COMMIT: ${{ github.sha }}
        run: |
          {
            echo "## Clickalize for iOS published to Loadly"
            echo
            echo "> **Ad Hoc build.** It will only install on the **$DEVICES device(s)**"
            echo "> registered in the \`$PROFILE\` profile. Any other device fails with an"
            echo "> unexplained \"Unable to Install\". Adding a tester means registering their"
            echo "> UDID, regenerating the profile, updating the secret and rebuilding."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Install | $URL |"
            echo "| Flavor | $FLAVOR |"
            echo "| CFBundleShortVersionString | ${NAME:-from pubspec} |"
            echo "| CFBundleVersion | $CODE |"
            echo "| Size | $SIZE |"
            echo "| Profile | $PROFILE ($DEVICES devices) |"
            echo "| Commit | $COMMIT |"
            echo "| Loadly build key | \`$BUILD_KEY\` |"
            if [ -n "$QR" ]; then
              echo
              echo "![QR]($QR)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: clickalize-ios-${{ steps.version.outputs.code }}-${{ steps.cfg.outputs.flavor }}
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # The runner is ephemeral, so this is belt-and-braces — but a keychain
      # left in the search list can confuse a later step in the same job, and
      # always() means it runs even when the build failed.
      - name: Remove the temporary keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
