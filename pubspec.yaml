name: clickalize
description: "Clickalize — WhatsApp Business vendor console for mobile."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management + DI
  flutter_riverpod: ^2.5.0

  # Routing
  go_router: ^14.0.0

  # Networking
  dio: ^5.4.0

  # Storage — secrets in the keychain, preferences in shared_preferences
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.0

  # Present only to satisfy the icon font manifest — the app draws Material
  # icons exclusively. Tree-shaken out of release builds.
  cupertino_icons: ^1.0.8

  # Media + platform
  cached_network_image: ^3.3.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  flutter_svg: ^2.0.10
  flutter_webrtc: ^1.5.2
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Build-time only — these generate native icon/splash resources from the
  # sources in tool/branding/ and are never linked into the app.
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
  fonts:
    # Variable fonts (all weights in one file). Inter carries the Latin/EN type
    # ramp from the Figma handoff; Cairo is swapped in for Arabic by
    # AppTheme.fontFor(). Deliberately no google_fonts — the bundled route
    # matches zoonze-app and avoids a network dependency at first paint.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf

# Launcher icon. Sources live in tool/branding/ (build-time inputs, kept out of
# assets/ so they are not bundled into the APK) and are rasterised from
# assets/branding/logo.svg.
#
# The mark is green-on-white and not tintable, so the icon is a green logo on a
# white ground rather than the reverse — the same treatment as BrandMark inside
# the app. Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "tool/branding/icon_legacy.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "tool/branding/icon_fg.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "tool/branding/icon_legacy.png"
    background_color: "#ffffff"
    theme_color: "#00bf63"
  windows:
    generate: true
    image_path: "tool/branding/icon_legacy.png"

# Native launch screen, shown before the Flutter engine draws its first frame.
# Without this the cold start flashed the platform default — black on a
# dark-mode device — before jumping to the green in-app splash.
#
# Android 12+ (API 31) ignores the legacy windowBackground drawable and uses its
# own splash API, configured separately below.
#
# The white disc behind the mark is baked into splash_a12.png rather than set via
# `icon_background_color`. That attribute maps to
# windowSplashScreenIconBackgroundColor, which stock Android draws as a circle
# but HyperOS draws as a hard-edged square — verified on a Redmi running API 36.
# Baking the shape in removes the OEM from the decision, and a disc is the right
# shape to bake because Android 12+ masks splash icons to a circle anyway, so the
# platform's own mask becomes a no-op.
#
# Pre-31 devices keep the rounded tile (splash_legacy.png), which matches
# BrandMark in the app.
# Regenerate with:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#00bf63"
  image: tool/branding/splash_legacy.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#00bf63"
    image: tool/branding/splash_a12.png
